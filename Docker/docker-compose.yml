services:
  nginx:
    image: nginx:alpine
    container_name: medihub_nginx
    ports:
      - "8080:80"
    volumes:
      - ../nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    depends_on:
      web1:
        condition: service_healthy
      web2:
        condition: service_healthy
      web3:
        condition: service_healthy
    restart: always
    networks:
      - app_network
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M

  web_base:
    build:
      context: ..
      dockerfile: Docker/DockerFile
    image: medihub_web
    profiles: ["build"]

  migrate:
    image: medihub_web
    container_name: medihub_migrate
    working_dir: /app
    user: root
    env_file:
      - ../.env
    volumes:
      - ..:/app
      - static_volume:/app/staticfiles
    command:
      [
        "sh",
        "-c",
        "chown -R app:app /app/staticfiles && python manage.py makemigrations --noinput && python manage.py migrate --noinput && python manage.py collectstatic --noinput",
      ]
    depends_on:
      db:
        condition: service_healthy
    networks:
      - app_network
    restart: no

  web1:
    image: medihub_web
    container_name: medihub_web1
    hostname: medihub_web1
    env_file:
      - ../.env
    environment:
      - PORT=8011
    ports:
      - "8011:8011"
    volumes:
      - ..:/app
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: always
    networks:
      - app_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8011/health/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 512M

  web2:
    image: medihub_web
    container_name: medihub_web2
    hostname: medihub_web2
    env_file:
      - ../.env
    environment:
      - PORT=8012
    ports:
      - "8012:8012"
    volumes:
      - ..:/app
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: always
    networks:
      - app_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8012/health/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 512M

  web3:
    image: medihub_web
    container_name: medihub_web3
    hostname: medihub_web3
    env_file:
      - ../.env
    environment:
      - PORT=8013
    ports:
      - "8013:8013"
    volumes:
      - ..:/app
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: always
    networks:
      - app_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8013/health/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 512M

  db:
    image: postgres:16-alpine
    env_file:
      - ../.env
    volumes:
      - db_data:/var/lib/postgresql/data
    restart: always
    networks:
      - app_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 512M

  redis:
    image: redis:7-alpine
    command: ["sh", "-c", "redis-server --requirepass $$REDIS_PASSWORD"]
    env_file:
      - ../.env
    restart: always
    networks:
      - app_network
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $$REDIS_PASSWORD ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M

volumes:
  db_data:
  static_volume:
  media_volume:

networks:
  app_network:
    driver: bridge
