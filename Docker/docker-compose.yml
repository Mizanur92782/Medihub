services:
  nginx:
    image: nginx:alpine
    container_name: medihub_nginx
    ports:
      - "8080:80"
    volumes:
      - ../nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - /var/www/medihub/static:/app/staticfiles
      - /var/www/medihub/media:/app/media
    depends_on:
      web1:
        condition: service_healthy
      web2:
        condition: service_healthy
      web3:
        condition: service_healthy
    restart: always
    networks:
      - app_network

  web_base:
    build:
      context: ..
      dockerfile: Docker/DockerFile
    image: medihub_web
    profiles: ["build"]

  migrate:
    image: medihub_web
    container_name: medihub_migrate
    working_dir: /app
    user: root
    env_file:
      - ../.env
    volumes:
      - ..:/app
      - /var/www/medihub/static:/app/staticfiles
      - /var/www/medihub/media:/app/media
    command: >
      sh -c "
      python manage.py makemigrations --noinput &&
      python manage.py migrate --noinput &&
      python manage.py collectstatic --noinput
      "
    depends_on:
      db:
        condition: service_healthy
    networks:
      - app_network
    restart: "no"

  web1:
    image: medihub_web
    container_name: medihub_web1
    hostname: web1
    env_file:
      - ../.env
    environment:
      - PORT=8011
    ports:
      - "8011:8011"
    volumes:
      - ..:/app
      - /var/www/medihub/static:/app/staticfiles
      - /var/www/medihub/media:/app/media
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: always
    networks:
      - app_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8011/health/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  web2:
    image: medihub_web
    container_name: medihub_web2
    hostname: web2
    env_file:
      - ../.env
    environment:
      - PORT=8012
    ports:
      - "8012:8012"
    volumes:
      - ..:/app
      - /var/www/medihub/static:/app/staticfiles
      - /var/www/medihub/media:/app/media
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: always
    networks:
      - app_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8012/health/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  web3:
    image: medihub_web
    container_name: medihub_web3
    hostname: web3
    env_file:
      - ../.env
    environment:
      - PORT=8013
    ports:
      - "8013:8013"
    volumes:
      - ..:/app
      - /var/www/medihub/static:/app/staticfiles
      - /var/www/medihub/media:/app/media
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: always
    networks:
      - app_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8013/health/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  db:
    image: postgres:16-alpine
    container_name: medihub_db
    env_file:
      - ../.env
    volumes:
      - db_data:/var/lib/postgresql/data
    restart: always
    networks:
      - app_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: medihub_redis
    command: ["sh", "-c", "redis-server --requirepass $$REDIS_PASSWORD"]
    env_file:
      - ../.env
    restart: always
    networks:
      - app_network
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $$REDIS_PASSWORD ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: medihub_rabbitmq
    ports:
      - "5671:5671"
      - "15671:15671"
    environment:
      - RABBITMQ_DEFAULT_USER=medihub
      - RABBITMQ_DEFAULT_PASS=medihub
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    restart: always
    networks:
      - app_network
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  celery_worker:
    image: medihub_web
    container_name: medihub_celery_worker
    command: celery -A medihub worker --loglevel=info
    env_file:
      - ../.env
    volumes:
      - ..:/app
    depends_on:
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: always
    networks:
      - app_network

  celery_beat:
    image: medihub_web
    container_name: medihub_celery_beat
    command: celery -A medihub beat --loglevel=info --schedule=/tmp/celerybeat-schedule
    env_file:
      - ../.env
    volumes:
      - ..:/app
    depends_on:
      rabbitmq:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: always
    networks:
      - app_network

volumes:
  db_data:
  rabbitmq_data:

networks:
  app_network:
    driver: bridge
    