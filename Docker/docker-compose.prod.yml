services:
  nginx:
    image: nginx:alpine
    container_name: medihub_nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    depends_on:
      web:
        condition: service_healthy
    restart: always
    networks:
      - app_network

  migrate:
    image: ${DOCKER_IMAGE}
    container_name: medihub_migrate
    working_dir: /app
    user: root
    env_file:
      - .env
    volumes:
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    command:
      [
        "sh",
        "-c",
        "chown -R app:app /app/staticfiles && python manage.py migrate --noinput && python manage.py collectstatic --noinput",
      ]
    depends_on:
      db:
        condition: service_healthy
    networks:
      - app_network
    restart: "no"

  web:
    image: ${DOCKER_IMAGE}
    container_name: medihub_web
    env_file:
      - .env
    environment:
      - PORT=8000
    ports:
      - "8000:8000"
    volumes:
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: always
    networks:
      - app_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  db:
    image: postgres:16-alpine
    container_name: medihub_db
    env_file:
      - .env
    volumes:
      - db_data:/var/lib/postgresql/data
    restart: always
    networks:
      - app_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: medihub_redis
    command: ["sh", "-c", "redis-server --requirepass $$REDIS_PASSWORD"]
    env_file:
      - .env
    restart: always
    networks:
      - app_network
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $$REDIS_PASSWORD ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: medihub_rabbitmq
    env_file:
      - .env
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    restart: always
    networks:
      - app_network
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  celery_worker:
    image: ${DOCKER_IMAGE}
    container_name: medihub_celery_worker
    command: celery -A medihub worker --loglevel=info
    env_file:
      - .env
    depends_on:
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: always
    networks:
      - app_network

  celery_beat:
    image: ${DOCKER_IMAGE}
    container_name: medihub_celery_beat
    command: celery -A medihub beat --loglevel=info --schedule=/tmp/celerybeat-schedule
    env_file:
      - .env
    depends_on:
      rabbitmq:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: always
    networks:
      - app_network

volumes:
  db_data:
  static_volume:
  media_volume:
  rabbitmq_data:
  
networks:
  app_network:
    driver: bridge
