name: Medihub CI

on:
  pull_request:
    branches: [dev]
    types: [opened, synchronize, reopened]

jobs:
  test:
    name: Run tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Load CI environment variables
        run: cat .env.ci >> $GITHUB_ENV

      - name: Set up Python 3.8
        uses: actions/setup-python@v5
        with:
          python-version: 3.8

      - name: Start services using docker compose
        run: docker compose -f Docker/docker-compose.cicd.yml up -d



      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-


      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install flake8 coverage

      - name: Wait for services
        run: |
          until docker exec medihub_ci_db pg_isready -U medihub; do sleep 2; done
          until docker exec medihub_ci_redis redis-cli ping | grep PONG; do sleep 2; done
          until docker exec medihub_ci_rabbitmq rabbitmq-diagnostics ping; do sleep 2; done

      - name: Create logs directory
        run: mkdir -p logs

      - name: Check django configuration
        run: python manage.py check

      - name: Lint with flake8
        run: |
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

      - name: Run migrations
        run: python manage.py migrate --noinput

      - name: Run tests with coverage
        run: coverage run manage.py test --verbosity=2

      - name: Coverage report
        run: coverage report --fail-under=30

      - name: Teardown services
        if: always()
        run: docker compose -f Docker/docker-compose.cicd.yml down
