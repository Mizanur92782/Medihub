name: Medihub CICD

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  push:
    branches: [main]


jobs:
  Test:
    name: Run tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Load CI environment variables
        run: cat .env.ci >> $GITHUB_ENV

      - name: Set up Python 3.8
        uses: actions/setup-python@v5
        with:
          python-version: 3.8

      - name: Start services using docker compose
        run: docker compose -f Docker/docker-compose.cicd.yml up -d



      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-


      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install flake8 coverage

      - name: Wait for services
        run: |
          until docker exec medihub_ci_db pg_isready -U medihub; do sleep 2; done
          until docker exec medihub_ci_redis redis-cli ping | grep PONG; do sleep 2; done
          until docker exec medihub_ci_rabbitmq rabbitmq-diagnostics ping; do sleep 2; done

      - name: Create logs directory
        run: mkdir -p logs

      - name: Check django configuration
        run: python manage.py check

      - name: Lint with flake8
        run: |
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

      - name: Run migrations
        run: python manage.py migrate --noinput

      - name: Run tests with coverage
        run: coverage run manage.py test --verbosity=2

      - name: Coverage report
        run: coverage report --fail-under=30

      - name: Teardown services
        if: always()
        run: docker compose -f Docker/docker-compose.cicd.yml down

  Build:
    name: Build and push Docker image to Docker Hub
    runs-on: ubuntu-latest
    needs: Test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Load CI environment variables
        run: cat .env.ci >> $GITHUB_ENV

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v3
        with:
          context: .
          file: Docker/Dockerfile
          push: true
          tags:  ${{ secrets.DOCKER_USERNAME }}/medihub:latest,  ${{ secrets.DOCKER_USERNAME }}/medihub:${{ github.sha }}


  Deploy:
    name: Deploy to AWS EC2
    runs-on: ubuntu-latest
    needs: Build

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Copy docker-compose.yml to EC2
        run: |
          echo "${{ secrets.EC2_SSH_KEY }}" > /tmp/ec2_key.pem
          chmod 600 /tmp/ec2_key.pem
          scp -i /tmp/ec2_key.pem -o StrictHostKeyChecking=no \
            Docker/docker-compose.prod.yml \
            ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:~/medihub/docker-compose.yml
          scp -i /tmp/ec2_key.pem -o StrictHostKeyChecking=no \
            nginx/nginx.conf \
            ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:~/medihub/nginx.conf

      - name: SSH and deploy to EC2
        uses: appleboy/ssh-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            echo "🔐 Login to Docker Hub..."
            docker login -u ${{ secrets.DOCKER_USERNAME }} -p ${{ secrets.DOCKER_PASSWORD }}

            echo "⬇️ Pull latest image..."
            docker pull ${{ secrets.DOCKER_USERNAME }}/medihub:latest

            echo "🔄 Restart containers..."
            cd ~/medihub
            if [ ! -f .env ]; then echo "❌ .env file missing on EC2!"; exit 1; fi

            if ! docker compose version &> /dev/null; then
              sudo apt install -y docker-compose-plugin
            fi

            DOCKER_IMAGE=${{ secrets.DOCKER_USERNAME }}/medihub:latest docker compose -f docker-compose.yml up -d --no-build --force-recreate

            echo "✅ Deployment successful!"
