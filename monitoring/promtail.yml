server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:

  # ── Job 1: live stdout/stderr from running containers ──────────────────────
  - job_name: medihub_docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
        filters:
          - name: name
            values:
              - medihub_web1
              - medihub_web2
              - medihub_web3
              - medihub_nginx
              - medihub_celery_worker
              - medihub_celery_beat
    relabel_configs:
      - source_labels: [__meta_docker_container_name]
        target_label: container
      - source_labels: [__meta_docker_container_log_stream]
        target_label: stream
    pipeline_stages:
      - json:
          expressions:
            levelname:  levelname
            name:       name
            request_id: request_id
            message:    message
      - labels:
          levelname:
          request_id:
      - drop:
          expression: ".*GET /health/"

  # ── Job 2: log FILES on disk — survives container crash/restart ────────────
  - job_name: medihub_files
    static_configs:
      - targets: [localhost]
        labels:
          job: medihub_files
          __path__: /app/logs/*.log   # mounted from web1_logs web2_logs web3_logs

    pipeline_stages:
      - json:
          expressions:
            levelname:  levelname
            name:       name
            request_id: request_id
            message:    message
      - labels:
          levelname:
          request_id:
      - drop:
          expression: ".*GET /health/"
