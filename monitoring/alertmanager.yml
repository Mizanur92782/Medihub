global:
  smtp_smarthost: "smtp.gmail.com:587"
  smtp_from: ""
  smtp_auth_username: ""
  smtp_auth_password: ""
  smtp_require_tls: true

route:
  receiver: email_alert
  group_by: ['alertname']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 1h

receivers:
  - name: email_alert
    email_configs:
      - to: ""
        send_resolved: true
    telegram_configs:
      - bot_token: ""
        chat_id: 
        send_resolved: true
        parse_mode: HTML
        message: |
          <b>{{ .Status | toUpper }}</b>
          <b>Alert:</b> {{ range .Alerts }}{{ .Labels.alertname }}{{ end }}
          <b>Severity:</b> {{ range .Alerts }}{{ .Labels.severity }}{{ end }}
          <b>Summary:</b> {{ range .Alerts }}{{ .Annotations.summary }}{{ end }}
