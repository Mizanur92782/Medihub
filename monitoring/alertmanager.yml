route:
  receiver: medihub_alert
  group_by: ['alertname', 'severity']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 1h

  routes:
    - match:
        severity: critical
      receiver: medihub_alert
      repeat_interval: 15m

    - match:
        severity: warning
      receiver: medihub_alert
      repeat_interval: 1h

receivers:
  - name: medihub_alert
    email_configs:
      - to: "mizanmd92782@gmail.com"
        send_resolved: true
        headers:
          Subject: '[Medihub] {{ .Status | toUpper }} - {{ range .Alerts }}{{ .Labels.alertname }}{{ end }}'
