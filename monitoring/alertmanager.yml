        chat_id: 7412860162
        send_resolved: true
        parse_mode: HTML
        message: |
          <b>{{ .Status | toUpper }} — Medihub Alert</b>
          {{ range .Alerts }}
          🔔 <b>{{ .Labels.alertname }}</b>
