<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Medihub — Server Health</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0f172a;
      font-family: 'Segoe UI', system-ui, sans-serif;
      color: #e2e8f0;
    }

    .card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 16px;
      padding: 40px 48px;
      width: 100%;
      max-width: 520px;
      box-shadow: 0 25px 50px rgba(0,0,0,0.4);
    }

    .header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 32px;
    }

    .logo {
      width: 42px;
      height: 42px;
      background: #3b82f6;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
    }

    .header h1 {
      font-size: 1.4rem;
      font-weight: 700;
      color: #f1f5f9;
    }

    .header p {
      font-size: 0.78rem;
      color: #64748b;
      margin-top: 2px;
    }

    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      background: #052e16;
      border: 1px solid #166534;
      color: #4ade80;
      font-size: 0.8rem;
      font-weight: 600;
      padding: 5px 14px;
      border-radius: 999px;
      margin-bottom: 28px;
    }

    .status-badge .dot {
      width: 8px;
      height: 8px;
      background: #4ade80;
      border-radius: 50%;
      animation: pulse 1.8s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }

    .grid {
      display: grid;
      gap: 12px;
    }

    .row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #0f172a;
      border: 1px solid #1e293b;
      border-radius: 10px;
      padding: 14px 18px;
    }

    .row .label {
      font-size: 0.78rem;
      color: #64748b;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .row .value {
      font-size: 0.9rem;
      font-weight: 600;
      color: #cbd5e1;
      font-family: 'Courier New', monospace;
    }

    .divider {
      border: none;
      border-top: 1px solid #1e293b;
      margin: 24px 0;
    }

    .last-updated {
      text-align: center;
      font-size: 0.75rem;
      color: #475569;
    }

    .last-updated span {
      color: #94a3b8;
      font-weight: 500;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="header">
      <div class="logo">🏥</div>
      <div>
        <h1>Medihub</h1>
        <p>Server Health Monitor</p>
      </div>
    </div>

    <div class="status-badge">
      <span class="dot"></span>
      Operational
    </div>

    <div class="grid">
      <div class="row">
        <span class="label">Container</span>
        <span class="value">{{ container }}</span>
      </div>
      <div class="row">
        <span class="label">Host</span>
        <span class="value">{{ host }}</span>
      </div>
      <div class="row">
        <span class="label">Endpoint</span>
        <span class="value">{{ fullpath }}</span>
      </div>
      <div class="row">
        <span class="label">Server Time</span>
        <span class="value">{{ server_time }}</span>
      </div>
      <div class="row">
        <span class="label">Date</span>
        <span class="value">{{ server_date }}</span>
      </div>
    </div>

    <hr class="divider"/>
    <p class="last-updated">Last updated: <span>{{ last_updated }}</span></p>
  </div>
</body>
</html>
